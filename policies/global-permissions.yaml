# Global AgentOps policy. Profile manifests may tighten this policy but must not remove these forbidden operations.

global_forbidden:
  - read_secret_values
  - execute_business_actions
  - bypass_approval
  - delete_runtime_state
  - bypass_hermes_runtime_provider
  - bypass_hermes_tool_registry

critical_change_paths:
  - profiles/*/SOUL.md
  - profiles/*/config.yaml
  - profiles/*/manifest.yaml
  - scripts/hermes-agentops
  - schemas/*
  - policies/*
  - .github/workflows/*

risk_defaults:
  low_required_approvals: 1
  medium_required_approvals: 1
  high_required_approvals: 2
  critical_required_approvals: 2
