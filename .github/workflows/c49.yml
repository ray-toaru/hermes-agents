name: c49

on:
  pull_request:
    paths:
      - '.github/workflows/c49.yml'
      - 'docs/P9_STAGE_READINESS_V6.md'
      - 'docs/examples/stage-readiness-v6.yaml'
      - 'schemas/stage-readiness-v6.schema.json'
      - 'tests/test_stage_readiness_v6.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Validate readiness
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_stage_readiness_v6.py
