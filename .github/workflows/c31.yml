name: c31

on:
  pull_request:
    paths:
      - '.github/workflows/c31.yml'
      - 'docs/STAGE_READINESS_V3.md'
      - 'docs/examples/stage-readiness-v3.yaml'
      - 'schemas/stage-readiness-v3.schema.json'
      - 'tests/test_stage_readiness_v3.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        run: |
          python -m pip install pyyaml jsonschema pytest
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_stage_readiness_v3.py
