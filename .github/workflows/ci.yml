name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest ruff

      - name: Compile CLI
        run: |
          python -m py_compile scripts/hermes-agentops scripts/check-codeowners scripts/check-pre-apply-plan scripts/generate-pre-apply-plan scripts/check-apply-lock scripts/acquire-apply-lock scripts/check-rollback-point scripts/check-audit-record scripts/check-approval-identity scripts/check-post-apply-validation scripts/analyze-apply-locks scripts/check-apply-readiness scripts/sandbox-apply-dry-run scripts/check-authenticated-approval

      - name: Validate schemas
        run: |
          python scripts/hermes-agentops validate-schemas

      - name: Validate profiles
        run: |
          python scripts/hermes-agentops validate -v

      - name: Validate CODEOWNERS baseline
        run: |
          python scripts/check-codeowners

      - name: Validate pre-apply plan example
        run: |
          python scripts/check-pre-apply-plan

      - name: Validate apply lock example
        run: |
          python scripts/check-apply-lock

      - name: Validate rollback point example
        run: |
          python scripts/check-rollback-point

      - name: Validate audit record example
        run: |
          python scripts/check-audit-record

      - name: Validate approval identity example
        run: |
          python scripts/check-approval-identity

      - name: Validate authenticated approval example
        run: |
          python scripts/check-authenticated-approval

      - name: Validate post-apply validation example
        run: |
          python scripts/check-post-apply-validation

      - name: Validate apply lock analysis example
        run: |
          python scripts/analyze-apply-locks --validate-report

      - name: Validate apply readiness report example
        run: |
          python scripts/check-apply-readiness

      - name: Run tests
        run: |
          pytest -q

      - name: Secret and runtime file guard
        run: |
          set -euo pipefail
          bad=""
          while IFS= read -r path; do
            case "$path" in
              */.env.template) continue ;;
            esac
            bad="$bad$path\n"
          done < <(find . \
            -path ./.git -prune -o \
            -type f \
            \( -name state.db \
              -o -name 'state.db-*' \
              -o -name .env \
              -o -name '*.pem' \
              -o -name '*.key' \
              -o -name secrets.json \
              -o -path '*/logs/*' \
              -o -path '*/sessions/*' \
              -o -path '*/workspaces/*' \
            \) -print)
          if [ -n "$bad" ]; then
            printf 'Forbidden files detected:\n%b' "$bad"
            exit 1
          fi
