name: c28

on:
  pull_request:
    paths:
      - '.github/workflows/c28.yml'
      - 'schemas/production-lock-readiness-source.schema.json'
      - 'scripts/verify-production-lock-readiness-source'
      - 'tests/test_production_lock_readiness_source.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest cryptography
      - name: check
        run: |
          python -m py_compile scripts/verify-production-lock-readiness-source
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_production_lock_readiness_source.py
