name: c29

on:
  pull_request:
    paths:
      - '.github/workflows/c29.yml'
      - 'docs/PRODUCTION_AUDIT_CLOSEOUT_CONTRACT.md'
      - 'docs/examples/production-audit-closeout-success.yaml'
      - 'docs/examples/production-audit-closeout-failure.yaml'
      - 'schemas/production-audit-closeout.schema.json'
      - 'tests/test_closeout_contract.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        run: |
          python -m pip install pyyaml jsonschema pytest
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_closeout_contract.py
