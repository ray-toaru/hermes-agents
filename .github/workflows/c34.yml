name: c34

on:
  pull_request:
    paths:
      - '.github/workflows/c34.yml'
      - 'scripts/collect-github-approval-source'
      - 'tests/test_github_approval_network_source.py'
      - 'docs/GITHUB_APPROVAL_NETWORK_ADAPTER.md'
      - 'docs/examples/capability-ledger.yaml'
      - 'docs/IMPLEMENTATION_MATRIX.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Validate collector
        run: |
          python -m py_compile scripts/collect-github-approval-source
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_github_approval_network_source.py
