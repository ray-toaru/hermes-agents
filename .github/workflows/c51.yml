name: c51

on:
  pull_request:
    paths:
      - '.github/workflows/c51.yml'
      - 'scripts/run-apply-entrypoint-blocked'
      - 'tests/test_apply_entrypoint_tree_guard.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
      - name: Run tests
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_apply_entrypoint_tree_guard.py
