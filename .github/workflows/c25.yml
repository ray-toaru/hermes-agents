name: c25

on:
  pull_request:
    paths:
      - '.github/workflows/c25.yml'
      - 'docs/GOVERNANCE_STAGE_GATE_ADR.md'
      - 'docs/examples/governance-stage-gate.yaml'
      - 'schemas/governance-stage-gate.schema.json'
      - 'tests/test_governance_stage_gate.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Run tests
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_governance_stage_gate.py
