name: c30

on:
  pull_request:
    paths:
      - '.github/workflows/c30.yml'
      - 'docs/RECOVERY_STAGE_ADR.md'
      - 'docs/examples/recovery-stage-adr.yaml'
      - 'schemas/recovery-stage-adr.schema.json'
      - 'tests/test_recovery_stage_adr.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run
        run: |
          python -m pip install pyyaml jsonschema pytest
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_recovery_stage_adr.py
