name: AgentOps task
description: Track a scoped AgentOps development task
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be changed?
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
      description: What is intentionally out of scope?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Official docs/source/tests/runtime evidence or clearly labeled inference.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk Level
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will this be verified?
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback
      description: How can this be safely reverted?
    validations:
      required: true
