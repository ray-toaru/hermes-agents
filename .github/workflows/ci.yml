name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest ruff cryptography

      - name: Compile CLI
        run: |
          python -m py_compile scripts/hermes-agentops scripts/check-codeowners scripts/check-pre-apply-plan scripts/generate-pre-apply-plan scripts/check-apply-lock scripts/acquire-apply-lock scripts/check-rollback-point scripts/check-audit-record scripts/check-approval-identity scripts/check-post-apply-validation scripts/analyze-apply-locks scripts/check-apply-readiness scripts/sandbox-apply-dry-run scripts/check-authenticated-approval scripts/verify-authenticated-approval scripts/check-structured-command scripts/run-structured-command-sandbox scripts/real-apply-lock-prototype scripts/create-rollback-point-prototype scripts/run-post-apply-validation-sandbox scripts/run-integrated-sandbox-mutation scripts/generate-sandbox-mutation-audit scripts/check-sandbox-mutation-audit scripts/simulate-sandbox-recovery scripts/check-sandbox-recovery-simulation scripts/check-real-apply-readiness-review scripts/check-real-apply-design-contract scripts/check-production-apply-lock-lifecycle scripts/run-production-lock-lifecycle-skeleton scripts/check-production-lock-skeleton-run

      - name: Validate schemas
        run: |
          python scripts/hermes-agentops validate-schemas

      - name: Validate profiles
        run: |
          python scripts/hermes-agentops validate -v

      - name: Validate CODEOWNERS baseline
        run: |
          python scripts/check-codeowners

      - name: Validate pre-apply plan example
        run: |
          python scripts/check-pre-apply-plan

      - name: Validate apply lock example
        run: |
          python scripts/check-apply-lock

      - name: Validate rollback point example
        run: |
          python scripts/check-rollback-point

      - name: Validate audit record example
        run: |
          python scripts/check-audit-record

      - name: Validate approval identity example
        run: |
          python scripts/check-approval-identity

      - name: Validate authenticated approval example
        run: |
          python scripts/check-authenticated-approval

      - name: Validate structured command example
        run: |
          python scripts/check-structured-command

      - name: Validate post-apply validation example
        run: |
          python scripts/check-post-apply-validation

      - name: Validate apply lock analysis example
        run: |
          python scripts/analyze-apply-locks --validate-report

      - name: Validate apply readiness report example
        run: |
          python scripts/check-apply-readiness

      - name: Validate real apply readiness review example
        run: |
          python scripts/check-real-apply-readiness-review docs/examples/p5-real-apply-readiness-review-v2.yaml

      - name: Validate real apply design contract example
        run: |
          python scripts/check-real-apply-design-contract docs/examples/real-apply-design-contract.yaml

      - name: Validate production apply lock lifecycle example
        run: |
          python scripts/check-production-apply-lock-lifecycle docs/examples/production-apply-lock-lifecycle.yaml

      - name: Validate production lock skeleton run example
        run: |
          python scripts/check-production-lock-skeleton-run docs/examples/production-lock-skeleton-run.yaml

      - name: Run tests (governance and validators)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 AGENTOPS_TEST_COMMAND_TIMEOUT_SECONDS=20 AGENTOPS_TEST_SCRIPT_TIMEOUT_SECONDS=20 timeout 180 pytest -q --basetemp=/tmp/agentops-pytest-g1 \
            tests/test_agentops_common.py \
            tests/test_apply_lock_acquisition.py \
            tests/test_apply_lock_analysis.py \
            tests/test_apply_readiness_report.py \
            tests/test_approval_identity_validator.py \
            tests/test_audit_record_validator.py \
            tests/test_authenticated_approval_validator.py \
            tests/test_authenticated_approval_verifier.py \
            tests/test_change_workflow.py \
            tests/test_governance_validators.py

      - name: Run tests (sandbox and readiness)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 AGENTOPS_TEST_COMMAND_TIMEOUT_SECONDS=20 AGENTOPS_TEST_SCRIPT_TIMEOUT_SECONDS=20 timeout 180 pytest -q --basetemp=/tmp/agentops-pytest-g2 \
            tests/test_integrated_sandbox_mutation.py \
            tests/test_policy_strictness.py \
            tests/test_post_apply_validation_sandbox_runner.py \
            tests/test_post_apply_validation_validator.py \
            tests/test_pre_apply_plan_generation.py \
            tests/test_production_apply_lock_lifecycle.py \
            tests/test_production_lock_skeleton_run.py \
            tests/test_read_only_evidence_chain.py \
            tests/test_real_apply_design_contract.py \
            tests/test_real_apply_lock_prototype.py \
            tests/test_real_apply_readiness_review.py \
            tests/test_rejection_status.py

      - name: Run tests (rollback, audit, recovery)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 AGENTOPS_TEST_COMMAND_TIMEOUT_SECONDS=20 AGENTOPS_TEST_SCRIPT_TIMEOUT_SECONDS=20 timeout 180 pytest -q --basetemp=/tmp/agentops-pytest-g3 \
            tests/test_rollback_point_creator_prototype.py \
            tests/test_rollback_point_validator.py \
            tests/test_sandbox_apply_dry_run.py \
            tests/test_sandbox_mutation_audit.py \
            tests/test_sandbox_recovery_simulation.py

      - name: Run tests (structured command validation)
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 AGENTOPS_TEST_COMMAND_TIMEOUT_SECONDS=20 AGENTOPS_TEST_SCRIPT_TIMEOUT_SECONDS=20 timeout 180 pytest -q --basetemp=/tmp/agentops-pytest-g4 \
            tests/test_structured_command_sandbox_runner.py \
            tests/test_structured_command_validator.py

      - name: Secret and runtime file guard
        run: |
          set -euo pipefail
          bad=""
          while IFS= read -r path; do
            case "$path" in
              */.env.template) continue ;;
            esac
            bad="$bad$path\n"
          done < <(find . \
            -path ./.git -prune -o \
            -type f \
            \( -name state.db \
              -o -name 'state.db-*' \
              -o -name .env \
              -o -name '*.pem' \
              -o -name '*.key' \
              -o -name secrets.json \
              -o -path '*/logs/*' \
              -o -path '*/sessions/*' \
              -o -path '*/workspaces/*' \
            \) -print)
          if [ -n "$bad" ]; then
            printf 'Forbidden files detected:\n%b' "$bad"
            exit 1
          fi
