name: c23

on:
  pull_request:
    paths:
      - '.github/workflows/c23.yml'
      - 'docs/COMMAND_CATALOG_DESIGN.md'
      - 'docs/examples/command-catalog.yaml'
      - 'schemas/command-catalog.schema.json'
      - 'tests/test_command_catalog.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Run tests
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_command_catalog.py
