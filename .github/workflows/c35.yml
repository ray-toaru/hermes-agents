name: c35

on:
  pull_request:
    paths:
      - '.github/workflows/c35.yml'
      - 'scripts/collect-production-lock-readiness-source'
      - 'tests/test_production_lock_path_dry_run.py'
      - 'docs/PRODUCTION_LOCK_PATH_DRY_RUN.md'
      - 'docs/examples/capability-ledger.yaml'
      - 'docs/IMPLEMENTATION_MATRIX.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Validate lock path collector
        run: |
          python -m py_compile scripts/collect-production-lock-readiness-source
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_production_lock_path_dry_run.py
