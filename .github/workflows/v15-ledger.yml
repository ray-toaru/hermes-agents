name: v15-ledger

on:
  pull_request:
    paths:
      - '.github/workflows/v15-ledger.yml'
      - 'docs/v15-capability-ledger.md'
      - 'docs/examples/capability-ledger.yaml'
      - 'schemas/capability-ledger.schema.json'
      - 'tests/test_capability_ledger.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Validate ledger
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_capability_ledger.py
