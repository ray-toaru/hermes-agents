name: c39

on:
  pull_request:
    paths:
      - '.github/workflows/c39.yml'
      - 'schemas/stage-readiness-v4.schema.json'
      - 'docs/examples/stage-readiness-v4.yaml'
      - 'docs/P7_STAGE_READINESS_V4.md'
      - 'tests/test_stage_readiness_v4.py'
      - 'docs/examples/capability-ledger.yaml'
      - 'docs/IMPLEMENTATION_MATRIX.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Validate stage readiness v4
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 timeout 120 pytest -q tests/test_stage_readiness_v4.py
